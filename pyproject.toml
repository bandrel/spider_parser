[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spider-parser"
version = "0.2.0"
description = "Parse NetExec spider_plus output and generate CIFS mount commands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
spider-parser = "spider_parser:main"

[project.urls]
Repository = "https://github.com/bandrel/spider_parser"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["spider_parser.py"]

[tool.hatch.build.targets.sdist]
include = ["spider_parser.py", "README.md", "pyproject.toml"]
